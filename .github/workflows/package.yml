name: Package

# Builds the universal macOS DMG candidate on a GitHub-hosted runner and attests the exact bytes with GitHub's keyless build provenance.
# It holds no update-signing key and never publishes: the Sparkle signature, the GitHub release and the signed feed stay local
# (`npm run release:package -- --ci-run <run id>` verifies this run's attestation, then signs those same DMG bytes with the Keychain key).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the universal DMG candidate
    # Manual runs are trusted only on main (the script refuses anything else too); tag pushes must match the package version, enforced by the script.
    if: github.repository == 'dhkimxx/omp-usage-panel' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.candidate.outputs.artifact-name }}
      archive-name: ${{ steps.candidate.outputs.archive-name }}
      archive-sha256: ${{ steps.candidate.outputs.archive-sha256 }}
      manifest-sha256: ${{ steps.candidate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No package or SDK cache is restored: the Sparkle SDK is downloaded and checked against its pinned size and SHA-256.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - run: npm ci --ignore-scripts
      # Built first, from a clean `git archive` snapshot of the triggering commit; refuses a dirty tree or any other commit.
      - name: Build the universal DMG candidate
        id: candidate
        run: node apps/macos/ci-release.mjs build
      - run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: build/ci-release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest:
    name: Attest the exact candidate bytes
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: candidate
      # The attested files must be byte-for-byte what the build job produced and hashed.
      - name: Require exactly the built files
        working-directory: candidate
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive-name }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_NAME" =~ ^OMP-Usage-[0-9]+\.[0-9]+\.[0-9]+\.dmg$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ && "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          shopt -s dotglob nullglob
          files=(*)
          [ "${#files[@]}" -eq 2 ]
          for file in "$ARCHIVE_NAME" candidate.json; do [ -f "$file" ] && [ ! -L "$file" ]; done
          echo "$ARCHIVE_SHA256  $ARCHIVE_NAME" | sha256sum --check --strict
          echo "$MANIFEST_SHA256  candidate.json" | sha256sum --check --strict
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/${{ needs.build.outputs.archive-name }}
            candidate/candidate.json
